name: Upload website to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Use pinned version instead of @master

      # Add build step if needed (e.g., npm run build)
      - name: Build
        run: |
          npm install && npm run build  # Add your framework's build command

      - name: Sync to S3
        uses: jakejarvis/s3-sync-action@v0.7.0
        with:
          args: --delete --acl bucket-owner-full-control --exclude '.github/*'  # Exclude workflows
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'af-south-1'
          SOURCE_DIR: 'static_web'  # Verify this folder exists
