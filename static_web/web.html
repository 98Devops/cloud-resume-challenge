  <style>
    /* [CSS Styles — unchanged from your code, so omitted for brevity] */

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const texts = [
        "Welcome to Tafara Rugara's Cloud Engineering Portfolio.",
        "AWS Certified Cloud Practitioner.",
        "Passionate about Cloud Technologies and DevOps."
      ];
      let index = 0;
      const typewriterElement = document.getElementById('typewriter');
      let isDeleting = false;
      let text = '';
      let typingSpeed = 100;
      let deletingSpeed = 50;
      let pauseDuration = 1000;

      function type() {
        const currentText = texts[index];
        if (isDeleting) {
          text = currentText.substring(0, text.length - 1);
        } else {
          text = currentText.substring(0, text.length + 1);
        }

        typewriterElement.textContent = text;

        if (!isDeleting && text === currentText) {
          setTimeout(() => {
            isDeleting = true;
            type();
          }, pauseDuration);
        } else if (isDeleting && text === '') {
          isDeleting = false;
          index = (index + 1) % texts.length;
          setTimeout(type, 500);
        } else {
          const speed = isDeleting ? deletingSpeed : typingSpeed;
          setTimeout(type, speed);
        }
      }

      type();
    });
  </script>

<script>
  // Visitor Counter Script (fixed for Lambda's response format)
  const counter = document.querySelector('#visitor-count');

  async function updateCounter() {
    try {
      let response = await fetch("https://63ykatqjy6om6a26n26jvj772q0rayxx.lambda-url.af-south-1.on.aws/");
      let data = await response.json();

      // Parse nested JSON in body string
      if (data && data.body) {
        const parsedBody = JSON.parse(data.body);

        if (parsedBody.views !== undefined) {
          counter.textContent = parsedBody.views;
        } else {
          console.error("Unexpected body format:", parsedBody);
          counter.textContent = "Error loading count";
        }
      } else {
        console.error("No body in response:", data);
        counter.textContent = "Error loading count";
      }
    } catch (error) {
      console.error("Error fetching visitor count:", error);
      counter.textContent = "Error loading count";
    }
  }

  updateCounter();
</script>
